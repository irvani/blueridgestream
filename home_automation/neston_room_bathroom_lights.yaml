# Neston's room + bathroom evening lights
#
# Schedule:
#   - ON  at sunset or 7:30 PM, whichever comes FIRST
#   - DIM starting at 8:00 PM (steps down to a soft glow)
#   - OFF at 8:20 PM
#
# BEFORE INSTALLING: replace the two entity IDs below with your real ones.
# Find them in Home Assistant under Settings -> Devices & Services -> Entities
# (search "neston"). They will look something like:
#   light.nestons_room
#   light.nestons_bathroom
#
# To install, either:
#   a) Paste these three blocks into your automations.yaml and reload
#      automations (Developer Tools -> YAML -> Reload Automations), or
#   b) In the HA UI: Settings -> Automations -> Create Automation ->
#      (three-dot menu) Edit in YAML, and paste one block at a time
#      (omit the leading "- " when pasting into the UI editor).

- id: neston_lights_evening_on
  alias: "Neston lights - on at sunset / 7:30 PM"
  description: >-
    Turns on Neston's room and bathroom lights at sunset or 7:30 PM,
    whichever comes first. The time guard keeps a late summer sunset
    (after 8:00 PM) from re-brightening the lights during wind-down.
  mode: single
  trigger:
    - platform: sun
      event: sunset
    - platform: time
      at: "19:30:00"
  condition:
    - condition: time
      before: "20:00:00"
  action:
    - service: light.turn_on
      target:
        entity_id:
          - light.nestons_room
          - light.nestons_bathroom
      data:
        brightness_pct: 100

- id: neston_lights_wind_down_dim
  alias: "Neston lights - dim for wind-down at 8:00 PM"
  description: >-
    Steps the lights down at 8:00 PM (60%) and 8:10 PM (30%) so the room
    gets noticeably dimmer heading toward lights-out. Only dims lights
    that are currently on, so a manually switched-off light stays off.
  mode: single
  trigger:
    - platform: time
      at: "20:00:00"
      id: dim_60
    - platform: time
      at: "20:10:00"
      id: dim_30
  action:
    - repeat:
        for_each:
          - light.nestons_room
          - light.nestons_bathroom
        sequence:
          - condition: template
            value_template: "{{ is_state(repeat.item, 'on') }}"
          - service: light.turn_on
            target:
              entity_id: "{{ repeat.item }}"
            data:
              brightness_pct: "{{ 60 if trigger.id == 'dim_60' else 30 }}"
              transition: 30

- id: neston_lights_off
  alias: "Neston lights - off at 8:20 PM"
  description: "Turns both lights off at 8:20 PM with a gentle fade."
  mode: single
  trigger:
    - platform: time
      at: "20:20:00"
  action:
    - service: light.turn_off
      target:
        entity_id:
          - light.nestons_room
          - light.nestons_bathroom
      data:
        transition: 5
